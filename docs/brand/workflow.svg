<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="228" viewBox="0 0 1440 228" role="img" aria-labelledby="title desc"><title id="title">The AI QA acceptance flow</title><desc id="desc">Sources to approved rules, test design, actual execution, evidence, and retesting against the original standard.</desc><rect width="1440" height="228" rx="20" fill="#0d2028"/><g font-family="Arial,Helvetica,sans-serif"><text x="32" y="42" font-size="12" letter-spacing="3" fill="#92b7bd">FROM INTENT TO EVIDENCE</text><g fill="none" stroke="#4b7779" stroke-width="2"><path d="M229 115h45m180 0h45m180 0h45m180 0h45m180 0h45"/></g><g fill="#162e37" stroke="#3b5b65"><rect x="30" y="70" width="195" height="93" rx="12"/><rect x="255" y="70" width="195" height="93" rx="12"/><rect x="480" y="70" width="195" height="93" rx="12"/><rect x="705" y="70" width="195" height="93" rx="12"/><rect x="930" y="70" width="195" height="93" rx="12"/><rect x="1155" y="70" width="255" height="93" rx="12"/></g><g fill="#c1f7a5" font-size="12"><text x="48" y="96">01 / CONTEXT</text><text x="273" y="96">02 / STANDARD</text><text x="498" y="96">03 / DESIGN</text><text x="723" y="96">04 / EXECUTION</text><text x="948" y="96">05 / EVIDENCE</text><text x="1173" y="96">06 / RETEST</text></g><g fill="#f2f8f8" font-size="19" font-weight="700"><text x="48" y="134">Read the sources</text><text x="273" y="134">Approve rules</text><text x="498" y="134">Build test cases</text><text x="723" y="134">Run real checks</text><text x="948" y="134">Inspect the proof</text><text x="1173" y="134">Retest original rules</text></g><text x="32" y="203" font-size="14" fill="#a5bec2">Current workflow: human-reviewed standards, constrained execution, explicit gaps. Autonomous adaptation is on the 2.0 roadmap.</text></g></svg>

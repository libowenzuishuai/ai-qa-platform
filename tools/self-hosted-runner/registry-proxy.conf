http_port 3128
pid_filename none
cache deny all
cache_mem 0 MB
access_log none
cache_log /dev/stderr
coredump_dir /tmp
acl CONNECT method CONNECT
acl SSL_ports port 443
acl registry_domains dstdomain registry.npmjs.org pypi.org files.pythonhosted.org
http_access deny !SSL_ports
http_access deny !CONNECT
http_access allow registry_domains
http_access deny all
shutdown_lifetime 0 seconds

# 本地开发编排：数据库、队列、API、worker、demo-app。
# 首次使用：cp .env.example .env 并填好种子密码，然后
#   docker compose up -d postgres redis
#   pnpm install && pnpm db:migrate && pnpm db:seed
#   pnpm dev:api & pnpm dev:demo &
# 或直接启动全部容器（应用容器在启动时安装依赖，较慢）：
#   docker compose up --build
#
# 说明：postgres 暴露在 5435、redis 在 6380，避免与宿主机已有服务冲突。

name: ai-qa

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aiqa
      POSTGRES_PASSWORD: aiqa_dev_password
      POSTGRES_DB: aiqa
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiqa"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "corepack enable && pnpm install --no-frozen-lockfile && pnpm --filter @ai-qa/api db:migrate && pnpm --filter @ai-qa/api start"
    environment:
      DATABASE_URL: postgresql://aiqa:aiqa_dev_password@postgres:5432/aiqa?schema=public
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      API_HOST: 0.0.0.0
      API_PORT: "7300"
      SEED_ADMIN_USERNAME: ${SEED_ADMIN_USERNAME:-admin}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-Admin#Dev2026}
    ports:
      - "127.0.0.1:7300:7300"
    volumes:
      - ./:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy

  # worker 只挂载自身构建产物与依赖，不挂载仓库（评审 三.5）：
  # 运行时智能体所在容器不应能读取 demo 源码或 tests-golden 评测答案。
  # 宿主侧先 pnpm --filter @ai-qa/worker build 产出纯 JS。
  worker:
    image: node:22-alpine
    working_dir: /app/apps/worker
    command: sh -c "node dist/server.js"
    environment:
      WORKER_HOST: 0.0.0.0
      WORKER_PORT: "7200"
      REDIS_URL: redis://redis:6379/0
    ports:
      - "127.0.0.1:7200:7200"
    volumes:
      - ./apps/worker/dist:/app/apps/worker/dist:ro
      - ./apps/worker/node_modules:/app/apps/worker/node_modules:ro
      - ./node_modules:/app/node_modules:ro
    depends_on:
      - redis

  # demo-app 为纯 JS 依赖：直接复用宿主 node_modules（挂载仓库）。
  # api/worker 依赖 Prisma 原生引擎，容器化需要可访问 npm registry 的网络
  # 构建镜像，本环境未验证；本地用 pnpm dev:api / worker 启动。
  # demo-app 在宿主侧编译为纯 JS（pnpm --filter @ai-qa/demo-app build），
  # 容器内直接 node dist/server.js，避免跨平台原生依赖。
  demo-app:
    image: node:22-alpine
    working_dir: /app/apps/demo-app
    command: sh -c "node dist/server.js"
    environment:
      DEMO_HOST: 0.0.0.0
      DEMO_PORT: "7400"
      DEMO_DB_PATH: /app/data/demo-app.sqlite
      DEMO_FIXTURE_TOKEN: ${DEMO_FIXTURE_TOKEN:-dev-fixture-token}
      # 缺陷模式只由评测配置注入，不写在镜像里
      DEMO_BUG_MODES: ${DEMO_BUG_MODES:-}
    ports:
      - "127.0.0.1:7400:7400"
    volumes:
      - ./:/app
      - demo-data:/app/data

volumes:
  pgdata:
  demo-data:
